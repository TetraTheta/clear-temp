[package]
description = "Clear temporary files on Windows"
edition = "2024"
name = "cleartemp"
version = "1.0.0"

[[bin]]
name = "ClearTemp"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1.31"
